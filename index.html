<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Algorithm Visualizer</title>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">
        <header class="app-header">
            <h1>Algorithm Visualizer</h1>
            <p id="algorithm-name"></p>
        </header>
        
        <div class="algorithm-control">
            <label for="algorithm-select">Algorithm</label>

            <select id="algorithm-select">
                <option value="bubble">Bubble Sort</option>
                <option value="selection">Selection Sort</option>
                <option value="insertion">Insertion Sort</option>
            </select>
        </div>

        <div class="slider-groups">

            <div class="array-controls">

                <div class="control-group">
                    <label for="array-size">Array Size:</label>

                    <div class="slider-row">
                        <input
                            type="range"
                            id="array-size"
                            min="5"
                            max="100"
                            value="20"
                        >

                        <span id="array-size-value"></span>
                    </div>
                </div>

                <button id="generate-button">Generate New Array</button>

            </div>
            
            <div class="playback-controls">

                <div class="control-group">
                    <label for="playback-speed">Playback Speed</label>
                    
                    <div class="slider-row">
                        <input
                            type="range"
                            id="playback-speed"
                            min="50"
                            max="1000"
                            value="250"
                            step="50"
                        >
                        <span id="playback-speed-value"></span>
                    </div>

                    <div class="step-buttons">
                        <button id="back-button">⏮</button>
                        <button id="play-pause-button">▶</button>
                        <button id="next-button">⏭</button>
                    </div>

                </div>
            </div>

        </div>

        <div id="step-status">
            Step 1 / 1
        </div>

        <div id="array-container"></div>
    </main>
    
    <script type="module" src="script.js"></script>
</body>
</html>
